name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: cargo test --manifest-path crates/lasa_engine/Cargo.toml --locked
      - run: cargo fmt --manifest-path crates/lasa_engine/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/lasa_engine/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run build
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
